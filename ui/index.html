<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مساعدي الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f1a; --bg2:#101728; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --txt:#eef2ff; --dim:#9aa7c7; --acc:#7c6cff; --acc2:#00d4b8;
  --grad:linear-gradient(135deg,#7c6cff,#00d4b8);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(600px 400px at 85% -5%,rgba(124,108,255,.18),transparent 60%),
  radial-gradient(500px 400px at 0% 100%,rgba(0,212,184,.12),transparent 60%);pointer-events:none}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(11,15,26,.75);border-bottom:1px solid var(--line)}
.hwrap{max-width:860px;margin:auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;box-shadow:0 4px 18px rgba(124,108,255,.4)}
h1{font-size:19px;font-weight:900}
.usage{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.uchip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--dim)}
.uchip b{color:var(--acc2);font-size:13px}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;width:38px;height:38px;font-size:17px;cursor:pointer;transition:.15s}
.iconbtn:hover{background:var(--card2);transform:translateY(-1px)}
main{max-width:860px;margin:auto;padding:16px;display:flex;flex-direction:column;min-height:calc(100vh - 63px)}
#chat{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.empty{text-align:center;color:var(--dim);margin-top:12vh}
.empty .big{font-size:46px;margin-bottom:10px}
.empty h2{color:var(--txt);font-size:22px;font-weight:900;margin-bottom:6px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.8;font-size:15px;white-space:pre-wrap;word-break:break-word;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.me{align-self:flex-start;background:var(--grad);color:#fff;border-end-start-radius:6px;box-shadow:0 4px 16px rgba(124,108,255,.25)}
.bot{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-end-end-radius:6px}
.meta{font-size:11px;color:var(--dim);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.meta .tk{color:var(--acc2)}
.typing{align-self:flex-end;color:var(--dim);font-size:14px;padding:8px 4px}
.typing span{animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
#composer{position:sticky;bottom:0;padding:10px 0 14px;background:linear-gradient(transparent,var(--bg) 30%)}
#modelbar{display:flex;gap:8px;margin-bottom:8px}
#modelpick{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px;cursor:pointer;font-size:13.5px;transition:.15s}
#modelpick:hover{border-color:var(--acc)}
#modelpick .nm{font-weight:700}
.badge{font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(124,108,255,.15);color:#b7adff;border:1px solid rgba(124,108,255,.3)}
.badge.p2{background:rgba(0,212,184,.12);color:#5eead4;border-color:rgba(0,212,184,.3)}
.inputrow{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--txt);font-family:inherit;font-size:15px;padding:13px 16px;max-height:130px;outline:none;transition:.15s}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,108,255,.15)}
#send{width:48px;height:48px;border:none;border-radius:16px;background:var(--grad);color:#fff;font-size:19px;cursor:pointer;transition:.15s;box-shadow:0 4px 16px rgba(124,108,255,.35)}
#send:hover{transform:translateY(-2px)} #send:disabled{opacity:.5;transform:none;cursor:default}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,8,15,.7);backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:860px;max-height:82vh;display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{padding:18px 20px 10px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.sheet .closex{margin-inline-start:auto}
#msearch{margin:0 20px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--txt);font-family:inherit;font-size:14px;outline:none}
#mlist{overflow-y:auto;padding:0 12px 20px}
.mitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.mitem:hover{background:var(--card2)}
.mitem.sel{border-color:var(--acc);background:rgba(124,108,255,.1)}
.mitem .nm{font-weight:700;font-size:14px}
.mitem .pv{font-size:11px;color:var(--dim)}
.mitem .tags{margin-inline-start:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.code{color:#7dd3fc;border-color:rgba(125,211,252,.35)}
.tag.img{color:#f0abfc;border-color:rgba(240,171,252,.35)}
.tag.txt{color:#a7f3d0;border-color:rgba(167,243,208,.35)}
.tag.tool{color:#fcd34d;border-color:rgba(252,211,77,.4)}
/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.srow label{font-size:14px;font-weight:600}
.srow .hint{font-size:11px;color:var(--dim);font-weight:400}
.srow input[type=number],.srow input[type=text]{width:110px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:7px 10px;font-family:inherit;outline:none}
.srow textarea{width:100%;min-height:70px}
.sw{position:relative;width:44px;height:24px;background:var(--card2);border-radius:999px;cursor:pointer;border:1px solid var(--line);transition:.2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:var(--grad);border-color:transparent}
.sw.on::after{transform:translateX(-20px);background:#fff}
/* setup */
#setup{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;place-items:center;padding:20px}
#setup.open{display:grid}
.scard{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:32px 26px;max-width:400px;width:100%;text-align:center}
.scard .logo{margin:0 auto 14px;width:54px;height:54px;font-size:28px;border-radius:16px}
.scard input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px 14px;font-family:inherit;font-size:13px;outline:none;margin:14px 0;direction:ltr;text-align:left}
.scard button{width:100%;padding:13px;border:none;border-radius:12px;background:var(--grad);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.scard .hint{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.7}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#3a1620;border:1px solid #7f2d3f;color:#fda4af;padding:10px 18px;border-radius:12px;font-size:13px;z-index:90;display:none;max-width:90%}
a{color:var(--acc2)}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">🤖</div>
  <h1>مساعدي الذكي</h1>
  <div class="usage">
    <div class="uchip">التوكنز النهارده: <b id="utok">0</b></div>
    <button class="iconbtn" id="settingsBtn" title="الإعدادات">⚙️</button>
  </div>
</div></header>

<main>
  <div id="chat">
    <div class="empty" id="emptyState">
      <div class="big">💬</div>
      <h2>أهلاً بيك!</h2>
      <p>اختار نموذج من تحت وابدأ كلام. كل النماذج دي شغالة ومجانية.</p>
    </div>
  </div>
  <div id="composer">
    <div id="modelbar">
      <div id="modelpick"><span style="font-size:16px">🧠</span><span class="nm" id="curModel">تلقائي (الأداة تختار)</span><span class="badge" id="curProv" style="display:none"></span></div>
    </div>
    <div class="inputrow">
      <textarea id="inp" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
      <button id="send" title="ابعت">➤</button>
    </div>
  </div>
</main>

<div class="overlay" id="modelSheet">
  <div class="sheet">
    <h3>اختار النموذج <button class="iconbtn closex" onclick="closeSheet('modelSheet')">✕</button></h3>
    <input id="msearch" placeholder="دوّر على نموذج...">
    <div id="mlist"></div>
  </div>
</div>

<div class="overlay" id="setSheet">
  <div class="sheet">
    <h3>⚙️ الإعدادات <button class="iconbtn closex" onclick="closeSheet('setSheet')">✕</button></h3>
    <div class="srow"><label>تعليمات النظام <div class="hint">شخصية المساعد وطريقة رده</div></label></div>
    <div class="srow" style="border:none;padding-top:0"><textarea id="sysPrompt" placeholder="مثال: رد باللهجة المصرية وباختصار"></textarea></div>
    <div class="srow"><label>الإبداع (Temperature) <div class="hint">أقل = أدق، أعلى = أكثر تنوع (0 لحد 2)</div></label><input type="number" id="temp" min="0" max="2" step="0.1" placeholder="افتراضي"></div>
    <div class="srow"><label>أقصى طول للرد (توكنز) <div class="hint">سيبه فاضي للافتراضي</div></label><input type="number" id="maxtok" min="1" max="32000" placeholder="افتراضي"></div>
    <div class="srow"><label>مفتاح الـ API <div class="hint">متخزن على جهازك بس</div></label><button class="iconbtn" style="width:auto;padding:0 14px;font-size:13px" onclick="resetKey()">تغيير المفتاح</button></div>
    <div class="srow"><label>لوحة التحكم الكاملة <div class="hint">إحصائيات كل مزود بالتفصيل</div></label><a href="https://freellm-router.onrender.com" target="_blank" style="font-size:13px">افتحها ↗</a></div>
  </div>
</div>

<div id="setup">
  <div class="scard">
    <div class="logo">🔑</div>
    <h2 style="font-weight:900">مفتاح التشغيل</h2>
    <input type="password" id="keyInp" placeholder="الصق المفتاح هنا (sk-...)">
    <button onclick="saveKey()">ابدأ</button>
    <div class="hint">المفتاح بيتخزن في متصفحك بس ومبيتبعتش لأي حد غير السيرفر بتاعك.<br>هتلاقيه في لوحة التحكم ← صفحة Keys.</div>
  </div>
</div>

<div id="toast"></div>

let KEY=localStorage.getItem('flk_key')||'';
let MODELS=[], curModel='auto', hist=[];
let dayTok=JSON.parse(localStorage.getItem('flk_tok')||'{"d":"","n":0}');

const $=s=>document.querySelector(s);
const today=()=>new Date().toDateString();
if(dayTok.d!==today()){dayTok={d:today(),n:0};saveTok();}
function saveTok(){localStorage.setItem('flk_tok',JSON.stringify(dayTok));renderTok();}
function arNum(n){
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+' مليون';
  if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+' ألف';
  return ''+n;
}
function renderTok(){$('#utok').textContent=arNum(dayTok.n)+' ('+dayTok.n.toLocaleString('en')+')';}
renderTok();

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',4500);}
function closeSheet(id){$('#'+id).classList.remove('open');}
function resetKey(){localStorage.removeItem('flk_key');location.reload();}
function saveKey(){const v=$('#keyInp').value.trim();if(!v)return;KEY=v;localStorage.setItem('flk_key',v);$('#setup').classList.remove('open');loadModels();}

if(!KEY)$('#setup').classList.add('open');else loadModels();

async function loadModels(){
  try{
    const r=await fetch(API+'/v1/models',{headers:{Authorization:'Bearer '+KEY}});
    if(r.status===401){localStorage.removeItem('flk_key');$('#setup').classList.add('open');toast('المفتاح غلط، دخّل مفتاح صح');return;}
    const d=await r.json();
    MODELS=(d.data||[]).filter(m=>m.available&&m.id!=='auto'&&!/whisper|transcribe|embed|tts|nova-3/i.test(m.id));
    renderList('');
  }catch(e){toast('مشكلة اتصال بالسيرفر. لو أول فتحة بعد فترة، السيرفر بيصحى خلال دقيقة - جرب تاني.');}
}

function capOf(m){
  const c=CAP[m.id]||{};
  const id=m.id.toLowerCase();
  const code=/code|coder|codestral|devstral|starcoder|deepseek-coder|qwen.*coder/i.test(id);
  return {p:c.p||'',t:!!c.t,v:!!c.v,code};
}
function tagsFor(m){
  const c=capOf(m);let h='';
  if(c.code)h+='<span class="tag code">💻 كود</span>';
  if(c.v)h+='<span class="tag img">🖼️ صور</span>';
  if(c.t)h+='<span class="tag tool">⚡ ينفذ مهام</span>';
  if(!c.code&&!c.v)h+='<span class="tag txt">📝 نصوص وردود</span>';
  return h;
}
function renderList(q){
  const el=$('#mlist');
  const items=[{id:'auto',name:'تلقائي (الأداة تختار الأنسب)',auto:true}].concat(MODELS);
  const f=items.filter(m=>!q||m.id.toLowerCase().includes(q)||(m.name||'').toLowerCase().includes(q));
  el.innerHTML=f.slice(0,120).map(m=>{
    const c=m.auto?{}:capOf(m);
    return `<div class="mitem ${m.id===curModel?'sel':''}" onclick="pickModel('${m.id.replace(/'/g,"\\'")}')">
      <div><div class="nm">${m.name||m.id}</div><div class="pv">${m.auto?'توزيع ذكي على كل المزودين':('المزود: '+(c.p||'-'))}</div></div>
      <div class="tags">${m.auto?'<span class="tag txt">موصى به</span>':tagsFor(m)}</div>
    </div>`;
  }).join('')||'<div style="color:var(--dim);text-align:center;padding:20px">لا نتائج</div>';
}
function pickModel(id){
  curModel=id;
  const m=id==='auto'?null:MODELS.find(x=>x.id===id);
  $('#curModel').textContent=m?(m.name||m.id):'تلقائي (الأداة تختار)';
  const p=$('#curProv');
  if(m&&capOf(m).p){p.textContent=capOf(m).p;p.style.display='';}
  else p.style.display='none';
  closeSheet('modelSheet');
}
$('#modelpick').onclick=()=>{$('#modelSheet').classList.add('open');$('#msearch').focus();};
$('#msearch').oninput=e=>renderList(e.target.value.toLowerCase());
$('#settingsBtn').onclick=()=>$('#setSheet').classList.add('open');

const inp=$('#inp');
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,130)+'px';});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('#send').onclick=send;

function addMsg(cls,text,meta){
  $('#emptyState')?.remove();
  const d=document.createElement('div');d.className='msg '+cls;
  d.textContent=text;
  if(meta){const m=document.createElement('div');m.className='meta';m.innerHTML=meta;d.appendChild(m);}
  $('#chat').appendChild(d);d.scrollIntoView({behavior:'smooth'});
  return d;
}

async function send(){
  const text=inp.value.trim();if(!text)return;
  inp.value='';inp.style.height='auto';
  addMsg('me',text);
  hist.push({role:'user',content:text});
  const tp=document.createElement('div');tp.className='typing';tp.innerHTML='بيفكر<span>.</span><span>.</span><span>.</span>';
  $('#chat').appendChild(tp);tp.scrollIntoView();
  $('#send').disabled=true;
  try{
    const body={model:curModel,messages:hist.slice(-20)};
    const sp=$('#sysPrompt').value.trim();
    if(sp)body.messages=[{role:'system',content:sp}].concat(body.messages);
    const t=parseFloat($('#temp').value);if(!isNaN(t))body.temperature=t;
    const mt=parseInt($('#maxtok').value);if(!isNaN(mt))body.max_tokens=mt;
    const r=await fetch(API+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+KEY},body:JSON.stringify(body)});
    const d=await r.json();
    tp.remove();
    if(d.error){
      let msg='حصل خطأ: '+(d.error.message||'مش معروف');
      if(/rate.?limit|cooldown|429/i.test(msg))msg='المزود ده مشغول دلوقتي (حد الاستخدام المجاني). جرب نموذج تاني من القايمة، أو استنى شوية.';
      addMsg('bot','⚠️ '+msg);$('#send').disabled=false;return;
    }
    const reply=d.choices?.[0]?.message?.content||'(رد فاضي)';
    hist.push({role:'assistant',content:reply});
    const u=d.usage;
    const tok=u?u.total_tokens:0;
    if(tok){dayTok.n+=tok;saveTok();}
    addMsg('bot',reply,`<span>النموذج: ${d.model||curModel}</span>`+(tok?`<span class="tk">التوكنز: ${arNum(tok)}</span>`:''));
  }catch(e){
    tp.remove();
    addMsg('bot','⚠️ مشكلة اتصال. السيرفر ممكن يكون بيصحى (بينام بعد ربع ساعة سكون) - جرب تاني بعد أقل من دقيقة.');
  }
  $('#send').disabled=false;
}
</script>
</body>
</html>
